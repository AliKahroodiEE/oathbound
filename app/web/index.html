<!DOCTYPE html>
<html>
<head>
  <!-- Replaced at build time by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oathbound — your character is who you become.">
  <meta name="theme-color" content="#0B0B10">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oathbound">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Oathbound</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B10; }
    /* Quiet loading state until the first Flutter frame replaces it. */
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #8A8F9C; font: 600 12px/1 serif; letter-spacing: .3em; text-transform: uppercase;
    }
    #loading::after {
      content: ""; position: absolute; width: 56px; height: 56px; border-radius: 50%;
      border: 1.5px solid #A71924; opacity: .4; animation: breathe 1.6s ease-in-out infinite alternate;
    }
    @keyframes breathe { from { opacity: .15; } to { opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { #loading::after { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading">Oathbound</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
