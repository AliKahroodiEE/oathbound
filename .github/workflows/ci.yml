name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Progression engine (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/oathbound_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart analyze --fatal-infos
      - run: dart test

  backend-engine:
    name: Progression engine (TypeScript conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run conformance vectors
        run: |
          if [ -f backend/supabase/functions/_shared/engine/engine.test.ts ]; then
            node --test backend/supabase/functions/_shared/engine/engine.test.ts
          else
            echo "TypeScript engine not present yet"
          fi

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib/app lib/core lib/data/models.dart lib/data/repositories lib/data/db/database.dart lib/design lib/features lib/l10n/content.dart lib/main.dart test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release
