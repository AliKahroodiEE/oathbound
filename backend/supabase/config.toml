# Supabase CLI configuration for LOCAL development (`supabase start` from backend/).
# Hosted projects are configured in the dashboard / via `supabase link`; nothing
# here is a secret. Values referenced as env(...) come from the shell or
# backend/supabase/.env (never committed).

project_id = "wyrd"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST. Internal helpers live in the
# `private` schema and are reachable only from SECURITY DEFINER functions.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true

[db.seed]
# No seed data: accounts are created through Auth, everything else through the app.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captures auth e-mails (magic links, confirmations) locally: http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
# Web build during development; native apps use the deep link below.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "io.wyrd.app://auth-callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Guest mode is local-only on the device (ADR-003); no anonymous server users.
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

# E-mail + password and magic link (OTP) sign-in.
[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally for convenience (mail goes to Inbucket anyway); ON in production.
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

# Sign in with Apple — disabled until credentials exist. For native iOS
# sign-in set client_id to the app bundle ID(s); for web, the Services ID and
# the generated secret (env var below).
[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

# Google sign-in — disabled until an OAuth client is configured.
[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
# per_worker: hot reload while developing; use "oneshot" to debug cold starts.
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Every function authenticates its callers in code (_shared/auth.ts): user
# access tokens with auth.getClaims, internal callers by a project secret key
# in the apikey header. verify_jwt adds the platform's JWT check in front;
# secret keys are not JWTs, so functions that internal callers reach run
# without it.

# User-facing: the app calls it with the user's access token. The function
# checks the token again and that the caller owns the completion.
[functions.evaluate-completion]
enabled = true
verify_jwt = true

# Users (their own chronicle) and pg_cron through pg_net (secret key as
# apikey, …_cron_secret_key.sql).
[functions.generate-chronicle]
enabled = true
verify_jwt = false

# Internal only: the notification triggers (…_notify_triggers.sql) and
# generate-chronicle send a secret key as apikey, or INTERNAL_FUNCTION_SECRET.
[functions.notify]
enabled = true
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"
